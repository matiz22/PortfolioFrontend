<div class="card bg-base-200 shadow-2xl h-full flex flex-col">
    <!-- Skeleton for image/thumbnail -->
    <div class="skeleton h-48 w-full rounded-t-2xl"></div>

    <!-- Skeleton for card body -->
    <div class="card-body items-center text-center flex flex-col flex-1">
        <!-- Skeleton for title -->
        <div class="skeleton h-8 w-3/4 mb-4"></div>

        <!-- Skeleton for description (2 lines) -->
        <div class="skeleton h-4 w-full mb-2"></div>
        <div class="skeleton h-4 w-5/6 mb-4"></div>

        <!-- Skeleton for technology badges -->
        <div class="flex gap-2 flex-wrap mt-4 justify-center">
            <div class="skeleton h-6 w-16"></div>
            <div class="skeleton h-6 w-20"></div>
            <div class="skeleton h-6 w-14"></div>
        </div>

        <!-- Skeleton for action buttons -->
        <div class="card-actions justify-center mt-4">
            <div class="skeleton h-12 w-28"></div>
        </div>
    </div>
</div>
