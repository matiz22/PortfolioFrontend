<section class="py-32 relative border-t border-white/5" id="contact">
    <div class="container mx-auto px-6 max-w-7xl relative">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 lg:gap-8 items-start">
            
            <!-- Left Header & CTA Copy (Spans 5 columns) -->
            <div class="lg:col-span-5 flex flex-col justify-center lg:sticky lg:top-24">
                <div class="inline-flex items-center gap-2 mb-6">
                    <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
                    <span class="text-xs font-mono tracking-widest uppercase text-primary" i18n="@@contact.badge">Let's Connect</span>
                </div>
                
                <h2 class="text-6xl md:text-7xl lg:text-8xl font-serif italic leading-[0.9] tracking-tight mb-8" i18n="@@contact.heading">
                    Let's Build<br>Something.
                </h2>
                
                <p class="text-base-content/60 text-lg md:text-xl font-mono tracking-tight max-w-md mb-12" i18n="@@contact.description">
                    Have a vision in mind? Let's engineer it together. Drop me a message and I'll get back to you as soon as possible.
                </p>
                
                <div class="flex flex-col gap-6">
                    <!-- Email Link -->
                    <a href="mailto:contact@malich.dev" target="_blank" rel="noopener noreferrer"
                        class="group inline-flex items-center gap-4 text-base-content hover:text-primary transition-colors font-mono text-lg md:text-xl border-b border-white/10 hover:border-primary pb-2 w-max">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <span>contact@malich.dev</span>
                    </a>
                    
                    <!-- Social Links -->
                    <div class="mt-4">
                        <app-social-links-row></app-social-links-row>
                    </div>
                </div>
            </div>

            <!-- Right Form Container (Spans 7 columns) -->
            <div class="lg:col-span-7 lg:pl-12">
                <div class="bg-[radial-gradient(oklch(79%_0.209_151.711_/_0.2)_1.5px,transparent_1.5px)] [background-size:24px_24px] rounded-3xl border border-white/10 p-1 relative overflow-hidden group">
                    <!-- Premium Glass Inner Card -->
                    <div class="bg-base-200/90 backdrop-blur-xl rounded-[22px] p-8 md:p-12 border border-white/5 relative z-10 transition-colors duration-500 group-hover:bg-base-200/80">
                        <h3 class="text-3xl font-serif italic mb-8 hidden lg:block" i18n="@@contact.formHeading">Send a Message</h3>
                        <app-contact-form></app-contact-form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
