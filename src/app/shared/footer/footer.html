<!-- Footer -->
<footer class="py-8 border-t border-base-300">
  <div class="container mx-auto px-6">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <!-- Copyright -->
      <div class="text-center md:text-left">
        <p class="text-base-content/60">&copy; 2025 Mateusz Malich. All rights reserved.</p>
      </div>

      <!-- Social Links -->
      @let socialLinksState = socialLinks();
      @switch (socialLinksState.status) {
      @case ('success') {
      <div class="flex flex-row-reverse space-x-4">
        @for (link of socialLinksState.data; track link.id) {
        <a [href]="link.url" target="_blank" rel="noopener noreferrer"
          class="btn btn-ghost btn-circle text-base-content/60 hover:text-primary transition" [title]="link.name">
          <img [src]="link.icon | imageUrl" class="w-5 h-5">
        </a>
        }
      </div>
      }
      }

      <!-- Privacy Policy Link -->
      <div>
        <a routerLink="/privacy-policy"
          class="link link-hover text-base-content/60 hover:text-primary transition text-sm">
          Privacy Policy
        </a>
      </div>
    </div>
  </div>
</footer>
