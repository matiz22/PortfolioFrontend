<ng-template #navLinks let-linkClass let-itemClass="itemClass">
  @for (link of navigation(); track link.chapter) {
    <li [class]="itemClass">
      @if (homeSections()) {
        <a [href]="'#' + link.chapter" [class]="linkClass">{{ link.label }}</a>
      } @else {
        <a [routerLink]="[link.route]" [class]="linkClass">{{ link.label }}</a>
      }
    </li>
  }
</ng-template>

<div class="fixed z-[9999] flex justify-center pointer-events-none">
  <nav
    class="w-full max-w-[95%] lg:w-fit bg-base-200/80 backdrop-blur-xl border text-base-content py-2 rounded-full pointer-events-auto transition-colors duration-300 overflow-visible">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center gap-10">
      <ng-template #brand>
        <span class="block font-pixel text-xl text-base-content hover:text-primary transition-colors">Malich.dev</span>
      </ng-template>
      @if (homeSections()) {
        <a href="#home" title="Mateusz Malich - Home" class="pl-2"><ng-container *ngTemplateOutlet="brand" /></a>
      } @else {
        <a [routerLink]="['/']" title="Mateusz Malich - Home" class="pl-2"><ng-container *ngTemplateOutlet="brand" /></a>
      }

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex items-center space-x-2">
        <ul class="flex items-center space-x-1 list-none m-0 p-0 text-xs font-medium">
          <ng-container *ngTemplateOutlet="navLinks; context: { $implicit: 'px-4 py-2 rounded-full text-base-content/70 hover:text-primary hover:bg-white/5 transition-colors uppercase tracking-widest' }" />
        </ul>
        <app-languages-switcher class="ml-4 flex-shrink-0 self-center" />
      </div>

      <!-- Mobile Navigation (Hamburger Dropdown) -->
      <div class="flex-none lg:hidden pr-2">
        <details #menuDetails>
          <summary aria-label="Navigation menu" i18n-aria-label="@@header.menu" class="btn btn-ghost btn-circle btn-sm text-base-content/70 flex justify-center" (click)="$event.stopPropagation()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </summary>

          <ul class="fixed top-20 left-0 right-0 bg-base-200/98 backdrop-blur-3xl rounded-box border-b border-white/10 text-base-content z-[999] shadow-[0_30px_60px_rgba(0,0,0,0.6)] p-4 flex flex-col gap-1 list-none animate-fade-in">
            <ng-container *ngTemplateOutlet="navLinks; context: { $implicit: 'block py-4 px-8 rounded-2xl hover:bg-primary/10 hover:text-primary transition-colors text-lg font-medium whitespace-nowrap', itemClass: 'w-full' }" />
            <li class="border-t border-white/5 mt-4 pt-4 px-6 w-full">
              <app-languages-switcher mode="inline" />
            </li>
          </ul>
        </details>
      </div>
    </div>
  </nav>
</div>
