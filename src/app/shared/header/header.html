<div class="fixed top-0 left-0 right-0 z-[9999] flex justify-center pointer-events-none">
  <nav
    class="mt-4 w-full max-w-[95%] lg:w-fit bg-base-200/80 backdrop-blur-xl border border-primary/30 text-base-content py-2 rounded-full pointer-events-auto transition-colors duration-300 overflow-visible">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center gap-10">
      <a [routerLink]="['/']" title="Mateusz Malich - Home" class="pl-2">
        <span class="block font-serif italic text-xl text-base-content hover:text-primary transition-colors">Malich.dev</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex items-center space-x-2">
        <ul class="flex items-center space-x-1 list-none m-0 p-0 text-xs font-medium">
          <li><a [routerLink]="['/projects']" i18n="@@header.nav.projects" title="Projects"
              class="px-4 py-2 rounded-full text-base-content/70 hover:text-primary hover:bg-white/5 transition-all uppercase tracking-widest">Projects</a></li>
          <li><a [routerLink]="['/realizations']" i18n="@@header.nav.realizations" title="Realizations"
              class="px-4 py-2 rounded-full text-base-content/70 hover:text-primary hover:bg-white/5 transition-all uppercase tracking-widest">Realizations</a>
          </li>
          <li><a [routerLink]="['/education']" i18n="@@header.nav.education" title="Education"
              class="px-4 py-2 rounded-full text-base-content/70 hover:text-primary hover:bg-white/5 transition-all uppercase tracking-widest">Education</a></li>
          <li><a [routerLink]="['/certifications']" i18n="@@header.nav.certificates" title="Certifications"
              class="px-4 py-2 rounded-full text-base-content/70 hover:text-primary hover:bg-white/5 transition-all uppercase tracking-widest">Certificates</a></li>
          <li><a [routerLink]="['/jobs']" i18n="@@header.nav.jobs" title="Work Experience"
              class="px-4 py-2 rounded-full text-base-content/70 hover:text-primary hover:bg-white/5 transition-all uppercase tracking-widest">Jobs</a></li>
        </ul>
        <app-languages-switcher class="ml-4 flex-shrink-0 self-center" />
      </div>

      <!-- Mobile Navigation (Hamburger Dropdown) -->
      <div class="flex-none lg:hidden pr-2">
        <ul class="menu menu-horizontal p-0">
          <li class="relative">
            <details #menuDetails class="w-full">
              <summary class="btn btn-ghost btn-circle btn-sm text-base-content/70 list-none w-full flex justify-center" (click)="$event.stopPropagation()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </summary>

              <ul class="fixed top-20 left-0 right-0 bg-base-200/98 backdrop-blur-3xl border-b border-white/10 text-base-content z-[999] shadow-[0_30px_60px_rgba(0,0,0,0.6)] p-4 flex flex-col gap-1 animate-fade-in">
                <li class="w-full"><a [routerLink]="['/projects']" i18n="@@header.nav.projects" title="Projects"
                    class="block py-4 px-8 rounded-2xl hover:bg-primary/10 hover:text-primary transition-colors text-lg font-medium whitespace-nowrap">Projects</a></li>
                <li class="w-full"><a [routerLink]="['/realizations']" i18n="@@header.nav.realizations" title="Realizations"
                    class="block py-4 px-8 rounded-2xl hover:bg-primary/10 hover:text-primary transition-colors text-lg font-medium whitespace-nowrap">Realizations</a></li>
                <li class="w-full"><a [routerLink]="['/education']" i18n="@@header.nav.education" title="Education"
                    class="block py-4 px-8 rounded-2xl hover:bg-primary/10 hover:text-primary transition-colors text-lg font-medium whitespace-nowrap">Education</a></li>
                <li class="w-full"><a [routerLink]="['/certifications']" i18n="@@header.nav.certifications" title="Certifications"
                    class="block py-4 px-8 rounded-2xl hover:bg-primary/10 hover:text-primary transition-colors text-lg font-medium whitespace-nowrap">Certifications</a></li>
                <li class="w-full"><a [routerLink]="['/jobs']" i18n="@@header.nav.jobs" title="Work Experience"
                    class="block py-4 px-8 rounded-2xl hover:bg-primary/10 hover:text-primary transition-colors text-lg font-medium whitespace-nowrap">Jobs</a></li>
                <li class="border-t border-white/5 mt-4 pt-4 px-6 w-full">
                  <app-languages-switcher mode="inline" />
                </li>
              </ul>
            </details>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
