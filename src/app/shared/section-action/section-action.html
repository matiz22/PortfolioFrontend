@let isCta = variant() === 'cta';
<span class="section-action-surface">
  <span class="section-action-decoration" [class]="scrollCue() ? 'aura aura-glow' : ''">
    <span class="section-action-chip"
      [class.btn]="isCta"
      [class.btn-primary]="isCta"
      [class.rounded-full]="isCta"
      [class.glass]="chipGlass()"
      [class.home-glass]="chipGlass()"
      [class.home-glass-chip]="chipGlass()">
      <span class="section-action-label"><ng-content /></span>
      @if (variant() === 'archive') {
      <svg class="section-action-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17 17 7M7 7h10v10" />
      </svg>
      }
    </span>
  </span>
</span>
