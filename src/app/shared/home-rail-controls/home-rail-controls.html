@if (position() !== 'hidden') {
<div class="rail-controls" role="group" [attr.aria-labelledby]="headingId()">
  <button type="button" [attr.aria-controls]="viewport().id" [attr.aria-disabled]="position() === 'start'"
    i18n-aria-label="@@home.rail.previous" aria-label="Previous card" (click)="move(-1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="m15 6-6 6 6 6" />
    </svg>
  </button>
  <button type="button" [attr.aria-controls]="viewport().id" [attr.aria-disabled]="position() === 'end'"
    i18n-aria-label="@@home.rail.next" aria-label="Next card" (click)="move(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" aria-hidden="true">
      <path d="m9 6 6 6-6 6" />
    </svg>
  </button>
</div>
}
