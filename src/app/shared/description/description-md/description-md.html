<div
    class="relative py-12 md:py-16 px-8 md:px-12 rounded-[2.5rem] bg-base-100/40 border border-white/5 backdrop-blur-md overflow-hidden">
    <!-- Multi-color atmospheric glows -->
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-primary/15 blur-[120px] rounded-full"></div>
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-accent/5 blur-[140px] rounded-full">
    </div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-secondary/10 blur-[120px] rounded-full"></div>

    <markdown [data]="description()" class="prose prose-invert prose-lg max-w-none font-mono
               prose-headings:font-serif prose-headings:italic prose-headings:font-normal prose-headings:tracking-tight prose-headings:mt-8 first-child:prose-headings:mt-0 prose-headings:mb-4
               prose-p:text-base-content/70 prose-p:leading-relaxed prose-p:mb-6
               prose-a:text-primary prose-a:underline prose-a:underline-offset-4 hover:prose-a:text-primary-focus transition-colors
               prose-strong:text-white prose-strong:font-bold
               prose-code:text-accent prose-code:bg-accent/5 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-md prose-code:before:content-none prose-code:after:content-none prose-code:font-mono prose-code:text-[0.9em]
               prose-blockquote:border-l-primary prose-blockquote:bg-white/[0.03] prose-blockquote:py-4 prose-blockquote:px-8 prose-blockquote:rounded-r-2xl prose-blockquote:not-italic prose-blockquote:text-base-content/60
               prose-img:rounded-3xl prose-img:shadow-2xl prose-img:border prose-img:border-white/5
               prose-ul:list-disc prose-ol:list-decimal prose-li:text-base-content/70">
    </markdown>
</div>
