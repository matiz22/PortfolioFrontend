<div
    class="relative py-12 md:py-16 px-8 md:px-12 rounded-2xl bg-base-100/40 border border-white/5 backdrop-blur-md overflow-hidden">
    @if (showGlow()) {
        <div class="description-glows pointer-events-none" aria-hidden="true">
            <div class="absolute -top-32 -right-32 w-96 h-96 bg-primary/15 blur-[120px] rounded-full"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-accent/5 blur-[140px] rounded-full"></div>
            <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-secondary/10 blur-[120px] rounded-full"></div>
        </div>
    }

    <markdown [data]="description()" class="markdown-prose markdown-prose-detail"></markdown>
</div>
