<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <app-header></app-header>

  <!-- Main Content -->
  <main class="flex-grow pt-16">
    <!-- Hero Section -->
    <app-hero-section></app-hero-section>
    <!-- About Section -->
    <app-about-me-section></app-about-me-section>

    <!-- Projects & Realizations Section with Tabs -->
    <app-projects-realizations-home-section></app-projects-realizations-home-section>

    <!-- Experience Section (Jobs Timeline) -->
    <app-job-timeline-section></app-job-timeline-section>

    <!-- Education Section -->
    <app-education-section></app-education-section>

    <!-- Certificates Section -->
    <section class="py-20" id="certificates">
      <div class="container mx-auto px-6">
        <h2 class="text-4xl font-bold text-center mb-12">Certificates & Courses</h2>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
          <app-certification-item></app-certification-item>
          <app-certification-item></app-certification-item>
          <app-certification-item></app-certification-item>
        </div>
      </div>
    </section>

    <!-- Contact Section -->
    <section class="py-20" id="contact">
      <div class="container mx-auto px-6">
        <h2 class="text-4xl font-bold text-center mb-12">Get In Touch</h2>
        <div class="max-w-2xl mx-auto">
          <div class="rounded-lg shadow-lg p-8">
            <form class="space-y-6">
              <div>
                <label class="block text-gray-700 font-semibold mb-2">Name</label>
                <input
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                  placeholder="Your Name"
                  type="text">
              </div>
              <div>
                <label class="block text-gray-700 font-semibold mb-2">Email</label>
                <input
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                  placeholder="your@email.com"
                  type="email">
              </div>
              <div>
                <label class="block text-gray-700 font-semibold mb-2">Message</label>
                <textarea
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500"
                  placeholder="Your message..."
                  rows="5"></textarea>
              </div>
              <button class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                      type="submit">
                Send Message
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <app-footer></app-footer>
</div>
