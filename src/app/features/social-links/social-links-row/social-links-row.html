@let socialLinksState = socialLinks();
@switch (socialLinksState.status) {
@case ('success') {
<div class="flex flex-col items-center gap-2">
    <span class="text-xs font-medium tracking-wider uppercase text-base-content/30" i18n="@@socialLinks.label">Social
        Links</span>
    <div class="flex flex-row space-x-1">
        @for (link of socialLinksState.data; track link.id) {
        <a [href]="link.url" target="_blank" rel="noopener noreferrer"
            class="btn btn-ghost btn-circle btn-sm text-base-content/40 hover:text-primary transition"
            [title]="link.name">
            <img [src]="link.icon | imageUrl" [alt]="link.name"
                class="w-4 h-4 opacity-50 hover:opacity-100 transition-opacity">
        </a>
        }
    </div>
</div>
}
}
