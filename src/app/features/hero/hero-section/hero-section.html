<section class="hero-section @container/hero relative overflow-hidden" aria-labelledby="hero-headline">
  <div class="hero-layout relative z-10 mx-auto grid w-full max-w-6xl gap-8 text-center">
    <figure class="hero-portrait">
      <div class="hero-image-container relative">
        <div class="hero-photo relative overflow-hidden">
          <img ngSrc="hero.png" width="500" height="500" alt="Mateusz Malich"
            class="w-full h-full object-cover" priority />
          <div class="hero-photo-blinds absolute inset-0 grid grid-rows-6 pointer-events-none" aria-hidden="true">
            @for (blind of [0, 1, 2, 3, 4, 5]; track blind) {
            <span class="hero-photo-blind" [style.--blind-index]="blind"></span>
            }
          </div>
        </div>
      </div>

      <figcaption class="hero-role-caption mt-4 pt-3 @min-[54rem]/hero:mt-5 @min-[54rem]/hero:pt-4">
        <p class="hero-name mb-2 font-pixel text-[2rem] leading-none tracking-tight @min-[54rem]/hero:mb-4 @min-[54rem]/hero:text-4xl"
          i18n="@@hero.heading">Mateusz Malich</p>
        <p class="hero-role-title text-[0.8125rem] font-semibold" i18n="@@hero.role.title">Forward Deployed Software Engineer</p>
        <p class="hero-role-specialty mt-1.5 text-xs text-primary" i18n="@@hero.role.tagline">From first conversation to launch</p>
      </figcaption>
    </figure>

    <div class="hero-copy min-w-0">
      <h1 id="hero-headline" class="hero-headline font-pixel font-normal">
        <span class="hero-headline-main mx-auto block text-balance" i18n="@@hero.headline.build">I build what’s missing.</span>
        <span class="hero-headline-accent block text-primary leading-[1.1]"
          i18n="@@hero.headline.connect">I connect what works.</span>
      </h1>

      <div class="hero-scroll-description mt-7 @min-[54rem]/hero:mt-8">
        <p class="hero-description glass home-glass home-copy-panel mx-auto max-w-[29rem] text-sm leading-[1.85] text-pretty"
          i18n="@@hero.description">
          I build websites, online stores, and apps for web, mobile, and desktop.
          I connect the tools you already use so your team doesn’t have to copy data from one system to another.
        </p>
      </div>

      <div class="hero-scroll-actions mt-8">
        <div class="hero-actions glass home-glass mx-auto flex w-fit max-w-full flex-wrap items-center justify-center gap-x-2 gap-y-1 rounded-2xl p-1 @min-[54rem]/hero:mx-0 @min-[54rem]/hero:justify-start">
          <a appSectionAction variant="cta" href="#work">
            <span i18n="@@hero.cta.work">See client work</span>
          </a>
          <a appSectionAction variant="continue" href="#contact">
            <span i18n="@@hero.cta.contact">Let’s talk</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="hero-next relative z-10 w-full max-w-6xl">
    <ng-content select="[section-next]" />
  </div>
</section>
