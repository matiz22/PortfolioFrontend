<section class="hero-section @container/hero relative overflow-hidden" aria-labelledby="hero-headline">
  <div class="hero-layout relative z-10 mx-auto grid w-full max-w-6xl gap-8 text-center">
    <figure class="hero-portrait">
      <div class="hero-image-container relative">
        @defer (on immediate) {
        <div class="hero-photo relative overflow-hidden">
          <img ngSrc="hero.png" width="500" height="500" alt="Mateusz Malich"
            class="w-full h-full object-cover" priority />
          <div class="hero-photo-blinds absolute inset-0 grid grid-rows-6 pointer-events-none" aria-hidden="true">
            @for (blind of [0, 1, 2, 3, 4, 5]; track blind) {
            <span class="hero-photo-blind" [style.--blind-index]="blind"></span>
            }
          </div>
        </div>
        } @placeholder {
        <div class="hero-photo skeleton"></div>
        }
      </div>

      <figcaption class="hero-role-caption mt-4 pt-3 @min-[54rem]/hero:mt-5 @min-[54rem]/hero:pt-4">
        <p class="hero-name mb-2 font-serif text-[2rem] italic leading-none tracking-tight @min-[54rem]/hero:mb-4 @min-[54rem]/hero:text-4xl"
          i18n="@@hero.heading">Mateusz Malich</p>
        <p class="hero-role-title text-[0.8125rem] font-semibold" i18n="@@hero.role.title">Software Engineer</p>
        <p class="hero-role-specialty mt-1.5 text-xs text-primary" i18n="@@hero.role.specialty">AI &amp; Automation</p>
      </figcaption>
    </figure>

    <div class="hero-copy min-w-0">
      <h1 id="hero-headline" class="hero-headline font-serif font-normal">
        <span class="hero-headline-main mx-auto block max-w-[11ch]" i18n="@@hero.headline.software">Thoughtful software.</span>
        <span class="hero-headline-accent block text-primary italic leading-[1.1]"
          i18n="@@hero.headline.workflows">Smarter workflows.</span>
      </h1>

      <div class="hero-scroll-description mt-7 @min-[54rem]/hero:mt-8">
        <p class="hero-description glass home-glass home-copy-panel mx-auto max-w-[29rem] text-sm leading-[1.85] text-pretty"
          i18n="@@hero.description">
          I design and build web, mobile, and desktop applications. Through AI integration and automation,
          I help businesses simplify workflows and turn complex requirements into practical software.
        </p>
      </div>

      <div class="hero-scroll-actions mt-8">
        <div class="hero-actions flex flex-wrap items-center justify-center gap-x-2 gap-y-1 @min-[54rem]/hero:justify-start">
          <a appSectionAction variant="cta" href="#work">
            <span i18n="@@hero.cta.work">Explore my work</span>
          </a>
          <a appSectionAction variant="continue" [glass]="true" href="#contact">
            <span i18n="@@hero.cta.contact">Let’s talk</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="hero-next relative z-10 w-full max-w-6xl">
    <ng-content select="[section-next]" />
  </div>

  <div class="absolute bottom-0 left-0 right-0" aria-hidden="true">
    <div class="section-divider w-full"></div>
  </div>
</section>
