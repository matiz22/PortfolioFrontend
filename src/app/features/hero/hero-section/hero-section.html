<section class="relative min-h-[80vh] overflow-hidden pt-30 pb-12 lg:pb-16" id="home">

  <!-- Backdrop: faint dot grid -->
  <div class="hero-dot-grid absolute inset-0 z-0 pointer-events-none" aria-hidden="true"></div>

  <!-- Main content -->
  <div class="relative z-10 flex items-center justify-center px-4">
    <div class="container mx-auto max-w-6xl">
      <div class="grid lg:grid-cols-2 gap-12 lg:gap-0 items-center">

        <!-- Content Section (left) -->
        <div class="relative z-20 text-center lg:text-left order-2 lg:order-1">
          <!-- Availability badge -->
          <div class="mb-7 animate-pure-fade">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-white/10 bg-white/[0.03]">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
              </span>
              <span class="text-xs font-medium tracking-wide uppercase text-base-content/90"
                i18n="@@hero.badge.available">Available for
                collaborations</span>
            </div>
          </div>

          <!-- Name — editorial serif (Slide Reveal, overlaps the photo on desktop) -->
          <div class="relative z-20 lg:-mr-24 xl:-mr-32 mb-6 animate-slide-reveal animation-delay-100">
            <h1
              class="font-serif italic text-5xl sm:text-6xl md:text-7xl lg:text-7xl xl:text-8xl text-base-content leading-[1.05] tracking-tight"
              i18n="@@hero.heading">
              Hi, I'm <span class="block text-primary">Mateusz Malich</span>
            </h1>
          </div>

          <!-- Roles — minimal inline text (Slide Reveal) -->
          <div class="mb-6 animate-slide-reveal animation-delay-200">
            <div
              class="flex flex-wrap items-center gap-x-3 gap-y-1 justify-center lg:justify-start text-xs sm:text-sm font-mono uppercase tracking-wide text-base-content/70">
              <span i18n="@@hero.badge.fullstack">Software Engineer</span>
              <span class="text-primary">/</span>
              <span i18n="@@hero.badge.engineer">AI Engineer</span>
            </div>
          </div>

          <!-- Tagline — one punchy line (Slide Reveal) -->
          <div class="mb-10 animate-slide-reveal animation-delay-300">
            <p class="text-xl md:text-2xl text-base-content/80 leading-snug max-w-md mx-auto lg:mx-0"
              i18n="@@hero.description">
              I turn ideas into <span class="font-serif italic text-primary">intelligent</span> digital products.
            </p>
          </div>

          <!-- CTA Buttons (Pure Fade) -->
          <div class="animate-pure-fade animation-delay-400">
            <div class="flex flex-wrap items-center justify-center lg:justify-start gap-4">
              <a [routerLink]="[]" fragment="about" class="btn btn-primary btn-lg gap-2 group">
                <ng-container i18n="@@hero.cta.about">More About Me</ng-container>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                  stroke="currentColor" class="w-4 h-4 group-hover:translate-x-1 transition-transform">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
              </a>
              <a [routerLink]="['/']" fragment="contact"
                class="btn btn-outline border-white/10 text-base-content btn-lg group hover:border-primary hover:text-primary hover:bg-transparent transition-all duration-300">
                <ng-container i18n="@@hero.cta.contact">Get In Touch</ng-container>
              </a>
            </div>
          </div>
        </div>

        <!-- Photo Section (right) -->
        <div class="relative flex justify-center lg:justify-end order-1 lg:order-2">
          <div class="hero-image-container relative w-full max-w-[260px] sm:max-w-xs md:max-w-sm lg:max-w-md">
            <div
              class="relative z-10 aspect-[3/4] w-full max-h-[560px] overflow-hidden rounded-t-3xl rounded-b-xl border border-white/10 animate-image-reveal-premium animation-delay-200">
              <img ngSrc="hero.png" width="384" height="512" alt="Mateusz Malich - Software Engineer"
                class="w-full h-full object-cover" priority />
            </div>
          </div>
        </div>

      </div>

      <!-- Scroll map — the site index -->
      <nav class="relative mt-14 lg:mt-20 animate-pure-fade animation-delay-500"
        aria-label="Site sections" i18n-aria-label="@@hero.index.label">
        <div class="grid grid-cols-2 md:grid-cols-4 border-y border-white/5">
          <a [routerLink]="[]" fragment="about"
            class="group flex items-center justify-between gap-3 px-5 py-5 sm:px-6 text-left font-mono text-xs uppercase tracking-widest text-base-content/60 border-b md:border-b-0 md:border-r border-white/5 hover:text-base-content hover:bg-white/[0.02] transition-colors duration-300">
            <span class="flex items-baseline gap-3">
              <span class="text-primary/70 group-hover:text-primary transition-colors duration-300">01</span>
              <span i18n="@@hero.index.about">About</span>
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor"
              class="w-3.5 h-3.5 text-primary opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </a>
          <a [routerLink]="[]" fragment="work"
            class="group flex items-center justify-between gap-3 px-5 py-5 sm:px-6 text-left font-mono text-xs uppercase tracking-widest text-base-content/60 border-b md:border-b-0 md:border-r border-white/5 hover:text-base-content hover:bg-white/[0.02] transition-colors duration-300">
            <span class="flex items-baseline gap-3">
              <span class="text-primary/70 group-hover:text-primary transition-colors duration-300">02</span>
              <span i18n="@@hero.index.work">Work</span>
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor"
              class="w-3.5 h-3.5 text-primary opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </a>
          <a [routerLink]="[]" fragment="experience"
            class="group flex items-center justify-between gap-3 px-5 py-5 sm:px-6 text-left font-mono text-xs uppercase tracking-widest text-base-content/60 md:border-r border-white/5 hover:text-base-content hover:bg-white/[0.02] transition-colors duration-300">
            <span class="flex items-baseline gap-3">
              <span class="text-primary/70 group-hover:text-primary transition-colors duration-300">03</span>
              <span i18n="@@hero.index.experience">Experience</span>
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor"
              class="w-3.5 h-3.5 text-primary opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </a>
          <a [routerLink]="[]" fragment="contact"
            class="group flex items-center justify-between gap-3 px-5 py-5 sm:px-6 text-left font-mono text-xs uppercase tracking-widest text-base-content/60 hover:text-base-content hover:bg-white/[0.02] transition-colors duration-300">
            <span class="flex items-baseline gap-3">
              <span class="text-primary/70 group-hover:text-primary transition-colors duration-300">04</span>
              <span i18n="@@hero.index.contact">Contact</span>
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor"
              class="w-3.5 h-3.5 text-primary opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </a>
        </div>
      </nav>
    </div>
  </div>

  <!-- Bottom divider -->
  <div class="absolute bottom-0 left-0 right-0">
    <div class="section-divider w-full"></div>
  </div>
</section>
