<section class="relative min-h-[70vh] overflow-hidden bg-base-100 pt-20" id="home">
  <!-- Animated gradient background -->
  <div class="absolute inset-0 bg-gradient-to-br from-primary/20 via-base-100 to-secondary/20 animate-gradient-shift">
  </div>

  <!-- Floating decorative elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-primary/30 rounded-full blur-3xl animate-float"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-secondary/20 rounded-full blur-3xl animate-float-delayed"></div>
    <div class="absolute bottom-1/4 left-1/3 w-64 h-64 bg-accent/20 rounded-full blur-3xl animate-float-slow"></div>
  </div>

  <!-- Grid pattern overlay -->
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.03)_1px,transparent_1px)] bg-[size:64px_64px] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,black_40%,transparent_100%)]">
  </div>

  <!-- Main content -->
  <div class="relative z-10 min-h-[70vh] flex items-center justify-center px-4">
    <div class="hero-content text-center">
      <div class="max-w-3xl mx-auto">
        <!-- Badge -->
        <div
          class="inline-flex items-center gap-2 px-4 py-2 mb-8 rounded-full bg-base-200/50 border border-base-300/50 backdrop-blur-sm animate-fade-in-up">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-primary"></span>
          </span>
          <span class="text-sm font-medium text-base-content/80" i18n="@@hero.badge.available">Available for new
            opportunities</span>
        </div>

        <!-- Main heading with gradient text -->
        <h1
          class="text-3xl sm:text-4xl md:text-6xl lg:text-7xl font-black mb-6 leading-tight animate-fade-in-up animation-delay-100 bg-gradient-to-r from-primary via-secondary to-accent bg-clip-text text-transparent animate-gradient-text bg-[length:200%_auto]"
          i18n="@@hero.heading">
          Hi, I'm Mateusz
        </h1>

        <!-- Subtitle with animated typing effect look -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-8 animate-fade-in-up animation-delay-200">
          <span class="badge badge-lg badge-primary badge-outline gap-2 min-w-[250px] justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
            </svg>
            <ng-container i18n="@@hero.badge.fullstack">Software Engineer</ng-container>
          </span>
          <span class="badge badge-lg badge-secondary badge-outline gap-2 min-w-[250px] justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
            </svg>
            <ng-container i18n="@@hero.badge.engineer">AI-Driven Solutions</ng-container>
          </span>
          <span class="badge badge-lg badge-accent badge-outline gap-2 min-w-[250px] justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
            </svg>
            <ng-container i18n="@@hero.badge.enthusiast">Tech Explorer</ng-container>
          </span>
        </div>

        <!-- Description -->
        <p class="text-base-content/70 text-lg md:text-xl max-w-2xl mx-auto mb-10 leading-relaxed animate-fade-in-up animation-delay-300"
          i18n="@@hero.description">
          Crafting elegant solutions and building exceptional digital experiences.
          Focused on simple, effective solutions, modern technologies, and continuous learning.
        </p>

        <!-- CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 animate-fade-in-up animation-delay-400">
          <a [routerLink]="[]" fragment="about"
            class="btn btn-primary btn-lg gap-2 group shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/40 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            <ng-container i18n="@@hero.cta.about">More About Me</ng-container>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-4 h-4 group-hover:translate-x-1 transition-transform">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
          </a>
          <a [routerLink]="['/']" fragment="contact"
            class="btn btn-outline btn-lg gap-2 group hover:bg-base-content hover:text-base-100 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
            <ng-container i18n="@@hero.cta.contact">Get In Touch</ng-container>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom rounded border divider -->
  <div class="absolute bottom-0 left-0 right-0 flex justify-center">
    <div class="w-full max-w-6xl h-px bg-gradient-to-r from-transparent via-white/30 to-transparent rounded-full"></div>
  </div>
</section>
