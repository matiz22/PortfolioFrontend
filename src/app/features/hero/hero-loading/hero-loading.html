<section class="relative min-h-[70vh] overflow-hidden bg-base-100 pt-20 pb-16">
    <!-- Animated gradient background -->
    <div class="absolute inset-0 bg-gradient-to-br from-primary/20 via-base-100 to-secondary/20 animate-gradient-shift">
    </div>

    <!-- Floating decorative elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-primary/30 rounded-full blur-3xl animate-float"></div>
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-secondary/20 rounded-full blur-3xl animate-float-delayed">
        </div>
        <div class="absolute bottom-1/4 left-1/3 w-64 h-64 bg-accent/20 rounded-full blur-3xl animate-float-slow"></div>
    </div>

    <!-- Grid pattern overlay -->
    <div
        class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.03)_1px,transparent_1px)] bg-[size:64px_64px] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,black_40%,transparent_100%)]">
    </div>

    <!-- Main content -->
    <div class="relative z-10 min-h-[70vh] flex items-center justify-center px-4">
        <div class="container mx-auto max-w-7xl">
            <div class="grid lg:grid-cols-2 gap-8 lg:gap-16 items-center">

                <!-- Photo Section Skeleton -->
                <div class="flex justify-center lg:justify-end order-1 lg:order-1">
                    <div class="relative">
                        <!-- Photo skeleton -->
                        <div class="w-64 h-64 md:w-80 md:h-80 lg:w-96 lg:h-96 rounded-full skeleton"></div>

                        <!-- Decorative floating icons skeletons -->
                        <div class="absolute -top-4 -right-4 w-12 h-12 rounded-full skeleton"></div>
                        <div class="absolute -bottom-6 -left-6 w-14 h-14 rounded-full skeleton"></div>
                        <div class="absolute top-8 -left-8 w-10 h-10 rounded-full skeleton"></div>
                        <div class="absolute bottom-8 -right-8 w-11 h-11 rounded-full skeleton"></div>
                    </div>
                </div>

                <!-- Content Section Skeleton -->
                <div class="text-center lg:text-left order-2 lg:order-2">
                    <!-- Badge skeleton -->
                    <div class="inline-flex items-center gap-2 px-4 py-2 mb-8 rounded-full">
                        <div class="skeleton h-3 w-3 rounded-full"></div>
                        <div class="skeleton h-4 w-48"></div>
                    </div>

                    <!-- Main heading skeleton -->
                    <div class="mb-6 space-y-3">
                        <div class="skeleton h-12 sm:h-16 md:h-20 lg:h-24 w-full max-w-xl mx-auto lg:mx-0"></div>
                    </div>

                    <!-- Badge group skeleton -->
                    <div class="flex flex-wrap items-center justify-center lg:justify-start gap-2 mb-8">
                        <div class="skeleton h-10 w-[250px] rounded-full"></div>
                        <div class="skeleton h-10 w-[250px] rounded-full"></div>
                        <div class="skeleton h-10 w-[250px] rounded-full"></div>
                        <div class="skeleton h-10 w-[250px] rounded-full"></div>
                    </div>

                    <!-- Description skeleton -->
                    <div class="max-w-2xl mx-auto lg:mx-0 mb-10 space-y-2">
                        <div class="skeleton h-6 w-full"></div>
                        <div class="skeleton h-6 w-5/6"></div>
                        <div class="skeleton h-6 w-4/6"></div>
                    </div>

                    <!-- CTA Buttons skeleton -->
                    <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4">
                        <div class="skeleton h-14 w-52 rounded-lg"></div>
                        <div class="skeleton h-14 w-52 rounded-lg"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bottom rounded border divider -->
    <div class="absolute bottom-0 left-0 right-0 flex justify-center">
        <div class="w-full max-w-6xl h-px bg-gradient-to-r from-transparent via-white/30 to-transparent rounded-full">
        </div>
    </div>
</section>
