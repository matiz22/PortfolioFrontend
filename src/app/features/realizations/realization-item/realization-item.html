<a [routerLink]="['/realization', realization.id]" [title]="realization.title"
  class="card bg-base-200/50 border border-white/5 hover:border-primary/30 transition-all duration-300 ease-out hover:-translate-y-1 h-full flex flex-col overflow-hidden">
  <!-- thumbnail (if available) -->
  @if (realization.thumbnail) {
  <figure>
    <img [alt]="realization.title" [src]="realization.thumbnail | imageUrl" class="w-full h-48 object-cover">
  </figure>
  }

  <div class="card-body items-center text-center flex flex-col flex-1">
    <h3 class="card-title font-mono tracking-tight">{{ realization.title || 'Untitled' }}</h3>

    <p class="text-sm text-base-content/60">
      @if (realization.clientName) {
      {{ realization.clientName }}
      •
      }
      {{ year || '' }}
    </p>

    <p class="mt-2 text-sm text-base-content/60">{{ summary }}</p>

    <div class="flex gap-1.5 flex-wrap mt-4 justify-center">
      @for (tech of techList; track tech.id) {
      <div class="badge badge-primary badge-outline badge-sm">{{ tech.name }}</div>
      }
    </div>
  </div>
</a>
