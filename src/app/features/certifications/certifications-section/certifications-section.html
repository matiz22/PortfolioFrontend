<section class="py-20" id="certifications">
    <div class="container mx-auto px-6">
        <h2 class="text-4xl font-bold text-center mb-12">Certifications</h2>

        <!-- Flex layout with centering: orphan items center nicely -->
        <div class="flex flex-row flex-wrap justify-center gap-4">
            @if (certifications(); as state) {
            @if (state.status === 'loading') {
            <div class="text-center w-full">
                <span class="loading loading-spinner loading-lg"></span>
            </div>
            } @else if (state.status === 'success') {
            @for (item of state.data; track item.id) {
            <app-certification-item [certification]="item"
                class="flex-1 min-w-full md:min-w-[calc(50%-0.5rem)] lg:min-w-[calc(33.333%-0.67rem)] md:max-w-[calc(50%-0.5rem)] lg:max-w-[calc(33.333%-0.67rem)]"></app-certification-item>
            }
            } @else if (state.status === 'error') {
            <div class="alert alert-error w-full">
                <span>{{ state.error }}</span>
            </div>
            }
            }
        </div>
    </div>
</section>
