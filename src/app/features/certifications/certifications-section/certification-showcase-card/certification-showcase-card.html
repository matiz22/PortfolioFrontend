@let item = certification();
<a class="certificate-link glass home-glass" [routerLink]="['/certification', item.slug]"
  [attr.aria-labelledby]="'certificate-title-' + item.id"
  [attr.aria-describedby]="'certificate-meta-' + item.id">
  <div class="certificate-art" aria-hidden="true">
    @if (item.thumbnail && failedThumbnail() !== item.thumbnail) {
    <img class="certificate-image" [src]="item.thumbnail | imageUrl" alt=""
      loading="lazy" decoding="async" (error)="failedThumbnail.set(item.thumbnail)" />
    } @else {
    <div class="certificate-fallback">
      <span class="certificate-fallback-issuer">{{ item.issuingOrganization }}</span>
      <span class="certificate-fallback-title">{{ item.name }}</span>
      <span class="certificate-fallback-rule"></span>
      <span class="certificate-fallback-year">{{ item.issueDate | date:'yyyy' }}</span>
    </div>
    }
  </div>

  <div class="certificate-caption">
    <div class="certificate-caption-copy">
      <h3 [id]="'certificate-title-' + item.id">{{ item.name }}</h3>
      <p [id]="'certificate-meta-' + item.id">
        <span>{{ item.issuingOrganization }}</span>
        <span class="certificate-meta-dot" aria-hidden="true">·</span>
        <time [attr.datetime]="item.issueDate | date:'yyyy-MM-dd'">{{ item.issueDate | date:'yyyy' }}</time>
      </p>
    </div>
    <span class="certificate-caption-arrow" aria-hidden="true">↗</span>
  </div>
</a>
