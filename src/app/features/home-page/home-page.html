<div class="min-h-screen flex flex-col">
    <!-- Header -->
    <app-header></app-header>

    <!-- Main Content -->
    <main class="flex-grow">
        <!-- Hero Section -->
        @defer{
        <app-hero-section></app-hero-section>
        }@placeholder {
        <app-hero-loading></app-hero-loading>
        }
        <!-- About Section -->
        @defer (on viewport) {
        <app-about-me-section></app-about-me-section>
        } @placeholder {
        <div class="min-h-64"></div>
        }

        <!-- Projects & Realizations Section with Tabs -->
        @defer (on viewport) {
        <app-projects-realizations-home-section></app-projects-realizations-home-section>
        } @placeholder {
        <div class="min-h-64"></div>
        }

        <!-- Certificates Section -->
        @defer (on viewport) {
        <app-certifications-section></app-certifications-section>
        } @placeholder {
        <div class="min-h-64"></div>
        }

        <!-- Experience Section (Jobs Timeline) -->
        @defer (on viewport) {
        <app-job-timeline-section></app-job-timeline-section>
        } @placeholder {
        <div class="min-h-64"></div>
        }

        <!-- Education Section -->
        @defer (on viewport) {
        <app-education-section></app-education-section>
        } @placeholder {
        <div class="min-h-64"></div>
        }

        <!-- Contact Section -->
        @defer (on viewport) {
        <app-contact-section></app-contact-section>
        } @placeholder {
        <div class="min-h-32"></div>
        }
    </main>
    <app-footer></app-footer>
</div>
