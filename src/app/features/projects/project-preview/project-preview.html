@let item = project();
<article class="project-preview glass home-glass" [attr.aria-labelledby]="'project-preview-title-' + item.id">
  <div class="project-preview-caption">
    <h3 class="project-preview-title font-pixel" [id]="'project-preview-title-' + item.id">
      <a [routerLink]="['/project', item.slug]" class="project-preview-title-link">
        <span>{{ item.title }}</span>
      </a>
    </h3>
    @if (item.technologies.length) {
    <ul appHomeMetadataPills class="project-preview-technologies" [items]="item.technologies"></ul>
    }
  </div>

  <div class="project-preview-visual">
    <div class="project-preview-art" aria-hidden="true">
      @if (item.thumbnail && !thumbnailFailed()) {
      <img class="project-preview-image" [src]="item.thumbnail | imageUrl" alt="" width="960" height="660"
        loading="lazy" decoding="async" (error)="thumbnailFailed.set(true)" />
      } @else {
      <div class="project-preview-fallback">
        <span class="project-preview-code">&lt;/&gt;</span>
        <span class="project-preview-fallback-title font-pixel">{{ item.title }}</span>
      </div>
      }
    </div>
    <div class="project-preview-shade" aria-hidden="true"></div>

  </div>

  <div class="project-preview-drawer">
    <div class="project-preview-brief">
      <p class="project-preview-description">{{ item.shortDesc }}</p>
      <div class="project-preview-actions">
        <a [routerLink]="['/project', item.slug]" class="project-preview-action home-text-action">
          <span i18n="@@projectPreview.viewProject">View project</span>
        </a>
        @if (item.liveUrl) {
        <a [href]="item.liveUrl" class="project-preview-action home-text-action" target="_blank" rel="noopener noreferrer">
          <span i18n="@@projectPreview.liveDemo">Live demo</span>
        </a>
        }
        @if (item.repoUrl) {
        <a [href]="item.repoUrl" class="project-preview-action home-text-action" target="_blank" rel="noopener noreferrer">
          <span i18n="@@projectPreview.source">Source</span>
        </a>
        }
      </div>
    </div>
  </div>
</article>
