<div
  class="card bg-base-200 shadow-2xl hover:shadow-2xl hover:bg-base-300 hover:-translate-y-2 transition-all h-full flex flex-col"
  routerLink="/project/{{ project.id }}">
  @if (project.thumbnail) {
  <figure>
    <img [alt]="project.title" [src]="project.thumbnail | imageUrl" class="w-full h-48 object-cover">
  </figure>
  }
  <!-- make card body flexible so content grows and actions stay at bottom -->
  <div class="card-body items-center text-center flex flex-col flex-1">
    <h3 class="card-title">{{ project.title }}</h3>
    <p>{{ project.shortDesc }}</p>
    <div class="flex gap-2 flex-wrap mt-4 justify-center">
      @for (technology of project.technologies; track technology.id) {
      <div class="badge badge-accent badge-outline">{{ technology.name }}</div>
      }
    </div>
    <div class="card-actions justify-center mt-4">
      @if (project.liveUrl) {
      <a [href]="project.liveUrl" class="btn btn-primary" rel="noopener noreferrer" target="_blank"
        i18n="@@projectItem.btn.viewLive">View Live</a>
      }
      @if (project.repoUrl) {
      <a [href]="project.repoUrl" class="btn btn-ghost" rel="noopener noreferrer" target="_blank">
        <svg class="w-5 h-5" viewBox="0 0 92 92" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="a">
              <path d="M0 .113h91.887V92H0Zm0 0" />
            </clipPath>
          </defs>
          <g clip-path="url(#a)">
            <path style="stroke:none;fill-rule:nonzero;fill:#f03c2e;fill-opacity:1"
              d="M90.156 41.965 50.036 1.848a5.918 5.918 0 0 0-8.372 0l-8.328 8.332 10.566 10.566a7.03 7.03 0 0 1 7.23 1.684 7.034 7.034 0 0 1 1.669 7.277l10.187 10.184a7.028 7.028 0 0 1 7.278 1.672 7.04 7.04 0 0 1 0 9.957 7.05 7.05 0 0 1-9.965 0 7.044 7.044 0 0 1-1.528-7.66l-9.5-9.497V59.36a7.04 7.04 0 0 1 1.86 11.29 7.04 7.04 0 0 1-9.957 0 7.04 7.04 0 0 1 0-9.958 7.06 7.06 0 0 1 2.304-1.539V33.926a7.049 7.049 0 0 1-3.82-9.234L29.242 14.272 1.73 41.777a5.925 5.925 0 0 0 0 8.371L41.852 90.27a5.925 5.925 0 0 0 8.37 0l39.934-39.934a5.925 5.925 0 0 0 0-8.371" />
          </g>
        </svg>
        <ng-container i18n="@@projectItem.btn.repository">Repository</ng-container>
      </a>
      }
    </div>
  </div>
</div>
