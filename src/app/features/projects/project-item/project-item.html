<a [routerLink]="['/project', project.slug]" [title]="project.title"
  [class]="project.thumbnail
    ? 'card image-full border border-white/5 hover:border-primary/30 transition-all duration-300 ease-out hover:-translate-y-1 h-full min-h-64 overflow-hidden'
    : 'card bg-base-200/50 border border-white/5 hover:border-primary/30 transition-all duration-300 ease-out hover:-translate-y-1 h-full min-h-64 overflow-hidden'">
  @if (project.thumbnail) {
  <figure>
    <img [alt]="project.title" [src]="project.thumbnail | imageUrl" />
  </figure>
  }
  <div class="card-body" [class.before:absolute]="project.thumbnail" [class.before:inset-0]="project.thumbnail" [class.before:bg-black/60]="project.thumbnail" [class.before:-z-10]="project.thumbnail">
    <h3 class="card-title font-mono tracking-tight">{{ project.title }}</h3>
    <p class="text-sm text-base-content/50">{{ project.shortDesc }}</p>
    <div class="flex gap-1.5 flex-wrap mt-4">
      @for (technology of project.technologies; track technology.id) {
      <div class="badge badge-primary badge-outline badge-sm">{{ technology.name }}</div>
      }
    </div>
    <div class="card-actions justify-end mt-auto">
      @if (project.liveUrl) {
      <a [href]="project.liveUrl" class="btn btn-primary btn-sm" rel="noopener noreferrer" target="_blank"
        i18n="@@projectItem.btn.viewLive">View Live</a>
      }
    </div>
  </div>
</a>
