<article appArchiveCard class="archive-card archive-card-compact">
  <div class="archive-card-media" aria-hidden="true">
    @if (project.thumbnail) {
      <img class="archive-card-cover" [src]="project.thumbnail | imageUrl" alt="" loading="lazy" decoding="async">
    } @else {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 6-6 6 6 6m8-12 6 6-6 6m-2-14-4 16" />
      </svg>
    }
  </div>

  <div class="archive-card-header">
    <h2 class="archive-card-title section-heading">
      <a class="project-card-link" [routerLink]="['/project', project.slug]">{{ project.title }}</a>
    </h2>
  </div>

  @if (project.shortDesc) {
    <p class="archive-card-summary">{{ project.shortDesc }}</p>
  }

  @if (project.technologies.length) {
    <ul class="archive-card-technologies" role="list">
      @for (technology of project.technologies; track technology.id) {
        <li>{{ technology.name }}</li>
      }
    </ul>
  }

  @if (project.liveUrl) {
    <a class="project-card-live home-text-action" [href]="project.liveUrl" rel="noopener noreferrer" target="_blank"
      i18n="@@projectItem.btn.viewLive">View Live</a>
  }
</article>
