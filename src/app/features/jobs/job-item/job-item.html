<a appArchiveCard class="archive-card archive-card-compact" [routerLink]="['/job', job.slug]">
  <div class="archive-card-header">
    <h2 class="archive-card-title section-heading">{{ job.title }}</h2>
  </div>

  <p class="job-company">{{ job.companyName }}</p>
  @if (job.location) {
    <p class="archive-card-summary">{{ job.location }}</p>
  }
  <app-portfolio-period class="archive-card-meta" [period]="job" format="MMM yyyy"></app-portfolio-period>

  @if (job.thumbnail) {
    <div class="archive-card-media job-card-media">
      <img class="archive-card-cover" [src]="job.thumbnail | imageUrl" alt="" loading="lazy" decoding="async">
    </div>
  }

  @if (job.technologies.length) {
    <ul class="archive-card-technologies" role="list">
      @for (technology of job.technologies; track technology.id) {
        <li>{{ technology.name }}</li>
      }
    </ul>
  }
</a>
