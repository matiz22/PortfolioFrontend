<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PortfolioFrontend</title>
  <base href="/">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- SEO & Open Graph Tags -->
  <meta property="og:title" content="Mateusz Malich - Software Engineer">
  <meta property="og:description" content="Turning your ideas into intelligent digital solutions.">
  <meta property="og:image" content="/opengraph.png">
  <meta property="og:type" content="website">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">
  <style>
    /* Critical CSS to prevent FOUC - matches --color-base-100 from theme */
    html,
    body {
      background-color: oklch(25.33% 0.016 252.42);
      color: oklch(97.807% 0.029 256.847);
    }
  </style>
</head>

<body class="relative overflow-x-hidden">
  <!-- Global background gradient decoration -->
  <div class="fixed inset-0 bg-gradient-to-br from-primary/5 via-transparent to-secondary/5 pointer-events-none z-0">
  </div>
  <div
    class="fixed top-0 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-3xl opacity-50 -translate-y-1/2 pointer-events-none z-0">
  </div>
  <div
    class="fixed bottom-0 right-1/4 w-72 h-72 bg-secondary/10 rounded-full blur-3xl opacity-50 translate-y-1/2 pointer-events-none z-0">
  </div>

  <app-root class="relative z-10"></app-root>
</body>

</html>
