<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PortfolioFrontend</title>
  <base href="/">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- SEO & Open Graph Tags -->
  <meta property="og:title" content="Mateusz Malich - Software Engineer">
  <meta property="og:description" content="Turning your ideas into intelligent digital solutions.">
  <meta property="og:image" content="/opengraph.png">
  <meta property="og:type" content="website">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=block"
    rel="stylesheet">
  <style>
    /* Critical CSS to prevent FOUC - matches new near-black base */
    html,
    body {
      background-color: #000000;
      color: #e8e8ec;
    }

    /* Critical skeleton styles for app shell & defer placeholders */
    .skeleton {
      animation: skeleton 1.8s ease-in-out infinite;
      background-color: #000000;
      background-image: linear-gradient(105deg, transparent 0%, transparent 40%, rgba(255, 255, 255, 0.04) 50%, transparent 60%, transparent 100%);
      background-size: 200% auto;
    }

    @keyframes skeleton {
      0% {
        background-position: 150%;
      }

      100% {
        background-position: -50%;
      }
    }

    /* Critical Header styles to prevent FOUC */
    app-header>div {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    app-header nav {
      margin-top: 1rem;
      width: fit-content;
      background-color: oklch(13% 0.005 260 / 80%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid oklch(79% 0.209 151.711 / 30%);
      color: oklch(93% 0.005 260);
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
      border-radius: 9999px;
      pointer-events: auto;
    }

    /* Critical inner layout for the nav so it doesn't stack vertically */
    app-header nav>div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      padding-left: 1.25rem;
      padding-right: 1.25rem;
      max-width: 80rem;
      margin-left: auto;
      margin-right: auto;
    }

    app-header nav ul {
      display: flex;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
  </style>
</head>

<body class="relative overflow-x-hidden">
  <!-- Subtle green radial glow — very faint -->
  <div class="fixed inset-0 pointer-events-none z-0"
    style="background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(74,222,128,0.04) 0%, transparent 60%);">
  </div>

  <app-root class="relative z-10"></app-root>
</body>

</html>
